<h1>隱私權政策</h1>
<p>最後更新：2026 年 11 月 11 日</p>
<h2>使用對象</h2>
<p>gws CLI 是個人使用的工具，只有擁有者本人會登入並授權，不開放給其他使用者。</p>
<h2>存取的資料</h2>
<p>本工具經擁有者授權後，透過 Google Workspace API 存取擁有者自己的 Google 帳戶資料，用途僅限於擁有者自己下達的操作。</p>
<h2>資料的儲存與分享</h2>
<p>本工具不蒐集、不販售、也不與任何第三方分享任何使用者資料。授權憑證只儲存在擁有者自己掌控的裝置與環境中。</p>
<h2>撤銷授權</h2>
<p>可隨時在 Google 帳戶的「第三方應用程式與服務」頁面撤銷本工具的存取權。</p>
<p><a href="index.html">回首頁</a></p>
